# === Perfil DEV: Supabase (PostgreSQL) ===
# Por defecto apunta al mismo proyecto Supabase del equipo (host de conexion
# directa, puerto 5432, requerido para que Flyway pueda ejecutar DDL sin
# pasar por el pooler en modo transaccion). Se puede sobreescribir con
# variables de entorno si alguien prefiere un Postgres local para pruebas
# aisladas.
spring.datasource.url=jdbc:postgresql://${DB_HOST:db.nxxpgadsjoagjaekrzik.supabase.co}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

logging.level.com.nexafarma=DEBUG
logging.level.org.springframework.security=DEBUG
