# === Perfil DEV: Supabase (PostgreSQL) via Session Pooler ===
# IMPORTANTE: la conexion "directa" (db.<ref>.supabase.co) solo resuelve por
# IPv6. La mayoria de redes locales/ISP son IPv4-only y fallan con
# UnknownHostException. El Session Pooler (Supavisor) si es IPv4 y se usa
# en el puerto 5432 (modo sesion, no 6543/transaccion) para que Flyway e
# Hibernate puedan usar prepared statements sin problemas.
# Verifica el host y usuario en el dashboard de Supabase: Project Settings >
# Database > Connection string > "Session pooler" (deben coincidir con
# los valores por defecto de abajo; si no, usa los del dashboard).
spring.datasource.url=jdbc:postgresql://${DB_HOST:aws-0-us-west-2.pooler.supabase.com}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require
spring.datasource.username=${DB_USER:postgres.nxxpgadsjoagjaekrzik}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

logging.level.com.nexafarma=DEBUG
logging.level.org.springframework.security=DEBUG
