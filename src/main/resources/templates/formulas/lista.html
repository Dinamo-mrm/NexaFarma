<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Fórmulas médicas')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="container">
    <h2 class="mb-3">Fórmulas médicas</h2>

    <div class="row g-3">
        <div class="col-lg-5">
            <div class="card mb-3">
                <div class="card-body">
                    <h5 class="card-title">Consultar por cliente</h5>
                    <div class="input-group mb-2">
                        <input type="number" id="clienteIdConsulta" class="form-control" placeholder="Id del cliente"/>
                        <button class="btn btn-outline-secondary" onclick="listarPorCliente()">Consultar</button>
                    </div>
                    <div id="listaFormulas"><p class="text-muted">Sin resultados todavía</p></div>
                </div>
            </div>
        </div>

        <div class="col-lg-7">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Registrar nueva fórmula</h5>
                    <form id="formFormula" onsubmit="return registrarFormula(event)">
                        <div class="row">
                            <div class="col-md-6 mb-2">
                                <label class="form-label">Cliente (id) *</label>
                                <input type="number" id="clienteId" class="form-control" required/>
                            </div>
                            <div class="col-md-6 mb-2">
                                <label class="form-label">Duración tratamiento (días) *</label>
                                <input type="number" id="duracionTratamientoDias" class="form-control" min="1" required/>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-2">
                                <label class="form-label">Médico *</label>
                                <input type="text" id="nombreMedico" class="form-control" required/>
                            </div>
                            <div class="col-md-6 mb-2">
                                <label class="form-label">Tarjeta profesional *</label>
                                <input type="text" id="numeroTarjetaProfesional" class="form-control" required/>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-2">
                                <label class="form-label">Entidad de salud</label>
                                <input type="text" id="entidadSalud" class="form-control"/>
                            </div>
                            <div class="col-md-6 mb-2">
                                <label class="form-label">Fecha de expedición *</label>
                                <input type="date" id="fechaExpedicion" class="form-control" required/>
                            </div>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">URL del adjunto escaneado</label>
                            <input type="text" id="archivoAdjuntoUrl" class="form-control" placeholder="https://..."/>
                        </div>

                        <hr/>
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h6 class="mb-0">Medicamentos amparados</h6>
                            <button type="button" class="btn btn-sm btn-outline-primary" onclick="agregarDetalle()">
                                + Agregar medicamento
                            </button>
                        </div>
                        <div id="detallesFormula"></div>

                        <div id="errorFormula" class="text-danger small mt-2"></div>
                        <button type="submit" class="btn btn-primary w-100 mt-3">Registrar fórmula</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/formulas-medicas.js}"></script>
</body>
</html>
