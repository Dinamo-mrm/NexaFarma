<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Medicamentos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Medicamentos</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalMedicamento" onclick="abrirNuevo()">
            + Nuevo medicamento
        </button>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <input type="search" id="filtroNombre" class="form-control" placeholder="Buscar por nombre comercial..."/>
        </div>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>Nombre comercial</th>
                    <th>Categoría</th>
                    <th>INVIMA</th>
                    <th>Precio venta</th>
                    <th>Etiquetas</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody id="tablaMedicamentos">
                <tr><td colspan="6" class="text-center text-muted py-4">Cargando…</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="modalMedicamento" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <form class="modal-content" id="formMedicamento" onsubmit="return guardarMedicamento(event)">
            <div class="modal-header">
                <h5 class="modal-title" id="tituloModal">Nuevo medicamento</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="medicamentoId"/>
                <div class="row">
                    <div class="col-md-6 mb-2">
                        <label class="form-label">Nombre comercial *</label>
                        <input type="text" class="form-control" id="nombreComercial" required/>
                    </div>
                    <div class="col-md-6 mb-2">
                        <label class="form-label">Nombre genérico</label>
                        <input type="text" class="form-control" id="nombreGenerico"/>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-2">
                        <label class="form-label">Código interno *</label>
                        <input type="text" class="form-control" id="codigoInterno" required/>
                    </div>
                    <div class="col-md-4 mb-2">
                        <label class="form-label">Código de barras</label>
                        <input type="text" class="form-control" id="codigoBarras"/>
                    </div>
                    <div class="col-md-4 mb-2">
                        <label class="form-label">Registro INVIMA *</label>
                        <input type="text" class="form-control" id="registroInvima" required/>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-2">
                        <label class="form-label">Categoría *</label>
                        <select class="form-select" id="categoriaId" required></select>
                    </div>
                    <div class="col-md-4 mb-2">
                        <label class="form-label">Proveedor *</label>
                        <select class="form-select" id="proveedorId" required></select>
                    </div>
                    <div class="col-md-4 mb-2">
                        <label class="form-label">Presentación</label>
                        <input type="text" class="form-control" id="presentacion" placeholder="Ej: Caja x 10 tabletas"/>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-3 mb-2">
                        <label class="form-label">Concentración</label>
                        <input type="text" class="form-control" id="concentracion" placeholder="Ej: 500mg"/>
                    </div>
                    <div class="col-md-3 mb-2">
                        <label class="form-label">Laboratorio</label>
                        <input type="text" class="form-control" id="laboratorioFabricante"/>
                    </div>
                    <div class="col-md-3 mb-2">
                        <label class="form-label">Precio de compra *</label>
                        <input type="number" class="form-control" id="precioCompra" min="0.01" step="0.01" required/>
                    </div>
                    <div class="col-md-3 mb-2">
                        <label class="form-label">Precio de venta *</label>
                        <input type="number" class="form-control" id="precioVenta" min="0.01" step="0.01" required/>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-2">
                        <label class="form-label">Stock mínimo</label>
                        <input type="number" class="form-control" id="stockMinimo" min="0" value="10"/>
                    </div>
                    <div class="col-md-6 mb-2">
                        <label class="form-label">Ubicación en bodega</label>
                        <input type="text" class="form-control" id="ubicacion"/>
                    </div>
                </div>
                <div class="row mt-2">
                    <div class="col-6 col-md-3 form-check">
                        <input class="form-check-input" type="checkbox" id="ventaLibre" checked/>
                        <label class="form-check-label" for="ventaLibre">Venta libre</label>
                    </div>
                    <div class="col-6 col-md-3 form-check">
                        <input class="form-check-input" type="checkbox" id="requiereFormula"/>
                        <label class="form-check-label" for="requiereFormula">Requiere fórmula</label>
                    </div>
                    <div class="col-6 col-md-3 form-check">
                        <input class="form-check-input" type="checkbox" id="usoControlado"/>
                        <label class="form-check-label" for="usoControlado">Uso controlado</label>
                    </div>
                    <div class="col-6 col-md-3 form-check">
                        <input class="form-check-input" type="checkbox" id="requiereRefrigeracion"/>
                        <label class="form-check-label" for="requiereRefrigeracion">Refrigeración</label>
                    </div>
                </div>
                <div id="errorMedicamento" class="text-danger small mt-2"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/medicamentos.js}"></script>
</body>
</html>
