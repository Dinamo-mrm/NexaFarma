<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Historial de ventas')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="container-fluid-nf">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <div>
            <h1 class="page-title mb-0">Historial de ventas</h1>
            <p class="page-subtitle mb-0">Consulta, filtra y anula ventas registradas</p>
        </div>
        <a class="btn btn-primary" th:href="@{/ventas/pos}">+ Nueva venta</a>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <label class="form-label small mb-2 d-block text-muted">Filtrar por estado</label>
            <div id="filtroEstado" class="pill-toggle-group"></div>
        </div>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                    <tr>
                        <th>N. venta</th>
                        <th>Cliente</th>
                        <th>Fecha</th>
                        <th>Total</th>
                        <th>Metodo de pago</th>
                        <th>Estado</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                    </thead>
                    <tbody id="tablaVentas">
                    <tr><td colspan="7" class="text-center text-muted py-4">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal detalle de venta -->
<div class="modal fade" id="modalDetalle" tabindex="-1" aria-labelledby="modalDetalleLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalDetalleLabel">Detalle de venta</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body" id="detalleVentaBody"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/ui-componentes.js}"></script>
<script th:src="@{/js/ventas-historial.js}"></script>
</body>
</html>
