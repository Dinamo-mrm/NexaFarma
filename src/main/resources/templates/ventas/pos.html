<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Punto de venta')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="container">
    <h2 class="mb-3">Punto de venta</h2>

    <div class="row g-3">
        <!-- Columna izquierda: datos de la venta + búsqueda de medicamentos -->
        <div class="col-lg-7">
            <div class="card mb-3">
                <div class="card-body">
                    <h5 class="card-title">Datos de la venta</h5>
                    <div class="row">
                        <div class="col-md-6 mb-2">
                            <label class="form-label">Cliente (documento) *</label>
                            <div class="input-group">
                                <input type="text" id="clienteDocumento" class="form-control" placeholder="Documento del cliente"/>
                                <button class="btn btn-outline-secondary" type="button" onclick="buscarCliente()">Buscar</button>
                            </div>
                            <div id="clienteEncontrado" class="form-text"></div>
                        </div>
                        <div class="col-md-6 mb-2">
                            <label class="form-label">Empleado (id) *</label>
                            <input type="number" id="empleadoId" class="form-control" placeholder="Id del empleado que atiende"/>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-2">
                            <label class="form-label">Método de pago *</label>
                            <select id="metodoPago" class="form-select">
                                <option value="EFECTIVO">Efectivo</option>
                                <option value="TARJETA_DEBITO">Tarjeta débito</option>
                                <option value="TARJETA_CREDITO">Tarjeta crédito</option>
                                <option value="TRANSFERENCIA">Transferencia</option>
                                <option value="PAGO_ELECTRONICO">Pago electrónico</option>
                                <option value="PAGO_MIXTO">Pago mixto</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-2">
                            <label class="form-label">Descuento</label>
                            <input type="number" id="descuento" class="form-control" value="0" min="0" step="0.01"/>
                        </div>
                    </div>
                    <p class="text-muted small mb-0">
                        Los medicamentos que requieren fórmula médica se validan automáticamente contra
                        las fórmulas vigentes del cliente al confirmar la venta — no hace falta indicarlas aquí.
                    </p>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Agregar medicamento</h5>
                    <div class="input-group mb-2">
                        <input type="search" id="buscarMedicamento" class="form-control"
                               placeholder="Buscar por nombre comercial..."/>
                        <button class="btn btn-outline-secondary" type="button" onclick="buscarMedicamentos()">Buscar</button>
                    </div>
                    <div id="resultadosMedicamento" class="list-group mb-2"></div>
                </div>
            </div>
        </div>

        <!-- Columna derecha: carrito y resumen -->
        <div class="col-lg-5">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Carrito</h5>
                    <div id="carrito"><p class="text-muted">Sin items todavía</p></div>
                    <hr/>
                    <div id="mensajeVenta" class="mb-2"></div>
                    <button class="btn btn-primary w-100" onclick="confirmarVenta()">Confirmar venta</button>
                </div>
            </div>
        </div>
    </div>

    <div class="card mt-4" id="tarjetaResultado" style="display:none;">
        <div class="card-body">
            <h5 class="card-title">Venta registrada</h5>
            <div id="resultadoVenta"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/ventas-pos.js}"></script>
</body>
</html>
