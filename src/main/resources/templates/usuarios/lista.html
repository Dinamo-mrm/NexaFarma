<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuarios')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="container">
    <h2 class="mb-3">Usuarios (credenciales de acceso)</h2>
    <p class="text-muted small">
        La lista completa de usuarios estará disponible cuando exista un endpoint de listado en la API.
        Por ahora, crea credenciales para un empleado o consúltalas por id.
    </p>

    <div class="row g-3">
        <div class="col-lg-6">
            <div class="card mb-3">
                <div class="card-body">
                    <h5 class="card-title">Crear credenciales</h5>
                    <form id="formCrearUsuario" onsubmit="return crearUsuario(event)">
                        <div class="mb-2">
                            <label class="form-label">Id del empleado *</label>
                            <input type="number" class="form-control" id="empleadoId" required/>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Usuario (username) *</label>
                            <input type="text" class="form-control" id="username" required/>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Contraseña *</label>
                            <input type="password" class="form-control" id="password" required minlength="8"/>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Rol *</label>
                            <select class="form-select" id="rol">
                                <option value="ADMINISTRADOR">Administrador</option>
                                <option value="FARMACEUTICO">Farmacéutico</option>
                                <option value="VENDEDOR">Vendedor</option>
                                <option value="AUXILIAR">Auxiliar de farmacia</option>
                            </select>
                        </div>
                        <div id="errorCrear" class="text-danger small mb-2"></div>
                        <button type="submit" class="btn btn-primary w-100">Crear usuario</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card mb-3">
                <div class="card-body">
                    <h5 class="card-title">Consultar usuario</h5>
                    <div class="input-group mb-3">
                        <input type="number" id="usuarioIdConsulta" class="form-control" placeholder="Id del usuario"/>
                        <button class="btn btn-outline-secondary" onclick="consultarUsuario()">Buscar</button>
                    </div>
                    <div id="detalleUsuario"><p class="text-muted">Sin resultados todavía</p></div>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Cambiar contraseña</h5>
                    <form id="formPassword" onsubmit="return cambiarPassword(event)">
                        <div class="mb-2">
                            <label class="form-label">Id del usuario *</label>
                            <input type="number" class="form-control" id="passUsuarioId" required/>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Contraseña actual *</label>
                            <input type="password" class="form-control" id="passActual" required/>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Contraseña nueva *</label>
                            <input type="password" class="form-control" id="passNueva" required minlength="8"/>
                        </div>
                        <div id="errorPassword" class="text-danger small mb-2"></div>
                        <button type="submit" class="btn btn-outline-primary w-100">Cambiar contraseña</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/usuarios.js}"></script>
</body>
</html>
