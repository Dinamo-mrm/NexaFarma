<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Devoluciones')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Devoluciones</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalDevolucion">+ Registrar devolución</button>
    </div>

    <ul class="nav nav-tabs mb-3">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabPendientes" onclick="cargarPendientes()">Pendientes de validar</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabCliente" onclick="cargarPorTipo('CLIENTE')">De clientes</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabProveedor" onclick="cargarPorTipo('PROVEEDOR')">A proveedores</button></li>
    </ul>

    <div class="tab-content">
        <div class="tab-pane fade show active" id="tabPendientes">
            <div id="listaPendientes"><p class="text-muted">Cargando…</p></div>
        </div>
        <div class="tab-pane fade" id="tabCliente"><div id="listaCliente"><p class="text-muted">—</p></div></div>
        <div class="tab-pane fade" id="tabProveedor"><div id="listaProveedor"><p class="text-muted">—</p></div></div>
    </div>
</div>

<div class="modal fade" id="modalDevolucion" tabindex="-1">
    <div class="modal-dialog">
        <form class="modal-content" id="formDevolucion" onsubmit="return registrarDevolucion(event)">
            <div class="modal-header">
                <h5 class="modal-title">Registrar devolución</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-2">
                    <label class="form-label">Tipo *</label>
                    <select class="form-select" id="tipo" onchange="alternarCampoOrigen()">
                        <option value="CLIENTE">Devolución de cliente</option>
                        <option value="PROVEEDOR">Devolución a proveedor</option>
                    </select>
                </div>
                <div class="mb-2" id="campoVentaOrigen">
                    <label class="form-label">Id de la venta de origen *</label>
                    <input type="number" class="form-control" id="ventaOrigenId"/>
                </div>
                <div class="mb-2" id="campoCompraOrigen" style="display:none;">
                    <label class="form-label">Id de la compra de origen *</label>
                    <input type="number" class="form-control" id="compraOrigenId"/>
                </div>
                <div class="row">
                    <div class="col-6 mb-2">
                        <label class="form-label">Id del medicamento *</label>
                        <input type="number" class="form-control" id="medicamentoId" required/>
                    </div>
                    <div class="col-6 mb-2">
                        <label class="form-label">Cantidad *</label>
                        <input type="number" class="form-control" id="cantidad" min="1" required/>
                    </div>
                </div>
                <div class="mb-2">
                    <label class="form-label">Motivo *</label>
                    <select class="form-select" id="motivo">
                        <option value="ERROR_DIGITACION">Error de digitación en venta</option>
                        <option value="PRODUCTO_DEFECTUOSO">Producto defectuoso</option>
                        <option value="ERROR_EN_LA_ENTREGA">Error en la entrega</option>
                        <option value="PRODUCTO_PROXIMO_A_VENCER">Próximo a vencer</option>
                        <option value="PRODUCTO_VENCIDO">Vencido</option>
                        <option value="RETIRO_DEL_MERCADO">Retiro del mercado</option>
                        <option value="DANO_EN_EL_EMPAQUE">Daño en el empaque</option>
                        <option value="ERROR_DEL_PROVEEDOR">Error del proveedor</option>
                    </select>
                </div>
                <div class="mb-2">
                    <label class="form-label">Estado del producto</label>
                    <input type="text" class="form-control" id="estadoProducto" placeholder="Ej: caja abierta, sin usar"/>
                </div>
                <div id="errorDevolucion" class="text-danger small"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-primary">Registrar</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/devoluciones.js}"></script>
</body>
</html>
