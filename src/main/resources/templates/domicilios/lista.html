<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Domicilios')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="container-fluid-nf">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <div>
            <h1 class="page-title mb-0">Gestión de domicilios</h1>
            <p class="page-subtitle mb-0">Tablero Kanban en tiempo real</p>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary btn-sm" type="button" onclick="cargarKanban()">Actualizar</button>
            <button class="btn btn-primary" type="button" data-bs-toggle="modal" data-bs-target="#modalDomicilio">+ Nuevo domicilio</button>
        </div>
    </div>

    <div class="kanban-board" id="kanbanBoard">
        <div class="kanban-col" data-estado="PENDIENTE">
            <div class="kanban-col-header"><span>Pendiente</span> <span class="badge bg-secondary" id="cnt-PENDIENTE">0</span></div>
            <div class="kanban-col-body" id="col-PENDIENTE"></div>
        </div>
        <div class="kanban-col" data-estado="EN_PREPARACION">
            <div class="kanban-col-header"><span>En preparación</span> <span class="badge bg-warning text-dark" id="cnt-EN_PREPARACION">0</span></div>
            <div class="kanban-col-body" id="col-EN_PREPARACION"></div>
        </div>
        <div class="kanban-col" data-estado="EN_CAMINO">
            <div class="kanban-col-header"><span>En camino</span> <span class="badge bg-info text-dark" id="cnt-EN_CAMINO">0</span></div>
            <div class="kanban-col-body" id="col-EN_CAMINO"></div>
        </div>
        <div class="kanban-col" data-estado="ENTREGADO">
            <div class="kanban-col-header"><span>Entregado</span> <span class="badge bg-success" id="cnt-ENTREGADO">0</span></div>
            <div class="kanban-col-body" id="col-ENTREGADO"></div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalDomicilio" tabindex="-1">
    <div class="modal-dialog">
        <form class="modal-content" id="formDomicilio" onsubmit="return registrarDomicilio(event)">
            <div class="modal-header">
                <h5 class="modal-title">Nuevo domicilio</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-6 mb-2">
                        <label class="form-label">Venta (id) *</label>
                        <input type="number" class="form-control" id="ventaId" required/>
                    </div>
                    <div class="col-6 mb-2">
                        <label class="form-label">Cliente (id) *</label>
                        <input type="number" class="form-control" id="clienteId" required/>
                    </div>
                </div>
                <div class="mb-2">
                    <label class="form-label">Dirección de entrega *</label>
                    <input type="text" class="form-control" id="direccionEntrega" required/>
                </div>
                <div class="row">
                    <div class="col-6 mb-2">
                        <label class="form-label">Teléfono de contacto *</label>
                        <input type="text" class="form-control" id="telefonoContacto" required/>
                    </div>
                    <div class="col-6 mb-2">
                        <label class="form-label">Valor del domicilio</label>
                        <input type="number" class="form-control" id="valorDomicilio" min="0" step="0.01"/>
                    </div>
                    <div class="col-12 mb-2">
                        <label class="form-label">Con cuánto paga el cliente (efectivo)</label>
                        <input type="number" class="form-control" id="montoPagaCliente" min="0" step="0.01"/>
                    </div>
                </div>
                <div id="errorDomicilio" class="text-danger small"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-primary">Registrar</button>
            </div>
        </form>
    </div>
</div>

<style>
.kanban-board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:1rem;align-items:start}
.kanban-col{background:#f4f6f9;border-radius:12px;min-height:420px;display:flex;flex-direction:column}
.kanban-col-header{padding:.75rem 1rem;font-weight:600;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e2e8f0}
.kanban-col-body{padding:.75rem;display:flex;flex-direction:column;gap:.75rem;flex:1}
.kanban-card{background:#fff;border-radius:10px;padding:.75rem;box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid #e8ecf1}
.kanban-card .actions{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.5rem}
@media (max-width:992px){.kanban-board{grid-template-columns:1fr 1fr}}
@media (max-width:576px){.kanban-board{grid-template-columns:1fr}}
</style>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/domicilios.js}"></script>
</body>
</html>
