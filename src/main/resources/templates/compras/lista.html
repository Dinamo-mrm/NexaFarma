<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Compras')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Compras a proveedores</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalCompra">+ Nueva orden de compra</button>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <label class="form-label small mb-1">Filtrar por estado</label>
            <select id="filtroEstado" class="form-select w-auto d-inline-block" onchange="cargarCompras()">
                <option value="PENDIENTE">Pendiente</option>
                <option value="RECIBIDA">Recibida</option>
                <option value="PARCIALMENTE_RECIBIDA">Parcialmente recibida</option>
                <option value="CANCELADA">Cancelada</option>
                <option value="DEVUELTA">Devuelta</option>
            </select>
        </div>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead>
                <tr><th>N.º compra</th><th>Proveedor</th><th>Fecha</th><th>Total</th><th>Estado</th><th class="text-end">Acciones</th></tr>
                </thead>
                <tbody id="tablaCompras"><tr><td colspan="6" class="text-center text-muted py-4">Cargando…</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal nueva orden de compra -->
<div class="modal fade" id="modalCompra" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Nueva orden de compra</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-6 mb-2">
                        <label class="form-label">Proveedor *</label>
                        <select class="form-select" id="proveedorId"></select>
                    </div>
                    <div class="col-md-6 mb-2">
                        <label class="form-label">Empleado responsable (id) *</label>
                        <input type="number" class="form-control" id="empleadoResponsableId"/>
                    </div>
                </div>
                <div class="mb-2">
                    <label class="form-label">Forma de pago *</label>
                    <select class="form-select" id="formaPago">
                        <option value="EFECTIVO">Efectivo</option>
                        <option value="TARJETA_DEBITO">Tarjeta débito</option>
                        <option value="TARJETA_CREDITO">Tarjeta crédito</option>
                        <option value="TRANSFERENCIA">Transferencia</option>
                        <option value="PAGO_ELECTRONICO">Pago electrónico</option>
                        <option value="PAGO_MIXTO">Pago mixto</option>
                    </select>
                </div>
                <hr/>
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6 class="mb-0">Items de la orden</h6>
                    <button type="button" class="btn btn-sm btn-outline-primary" onclick="agregarItemCompra()">+ Agregar item</button>
                </div>
                <div id="itemsCompra"></div>
                <div id="errorCompra" class="text-danger small mt-2"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="registrarCompra()">Registrar orden</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal recibir compra -->
<div class="modal fade" id="modalRecibir" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Recibir mercancía</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="text-muted small">Indica el número de lote y las fechas para cada item recibido.</p>
                <div id="detallesRecepcion"></div>
                <div id="errorRecibir" class="text-danger small mt-2"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="confirmarRecepcion()">Confirmar recepción</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/compras.js}"></script>
</body>
</html>
