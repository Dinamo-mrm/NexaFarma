<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Proveedores')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Proveedores</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalProveedor" onclick="abrirNuevo()">
            + Nuevo proveedor
        </button>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <input type="search" id="filtroRazonSocial" class="form-control" placeholder="Buscar por razón social..."/>
        </div>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>NIT</th>
                    <th>Razón social</th>
                    <th>Contacto</th>
                    <th>Teléfono</th>
                    <th>Correo</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody id="tablaProveedores">
                <tr><td colspan="6" class="text-center text-muted py-4">Cargando…</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="modalProveedor" tabindex="-1">
    <div class="modal-dialog">
        <form class="modal-content" id="formProveedor" onsubmit="return guardarProveedor(event)">
            <div class="modal-header">
                <h5 class="modal-title" id="tituloModal">Nuevo proveedor</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="proveedorId"/>
                <div class="mb-2">
                    <label class="form-label">NIT *</label>
                    <input type="text" class="form-control" id="nit" required/>
                </div>
                <div class="mb-2">
                    <label class="form-label">Razón social *</label>
                    <input type="text" class="form-control" id="razonSocial" required/>
                </div>
                <div class="mb-2">
                    <label class="form-label">Nombre de contacto</label>
                    <input type="text" class="form-control" id="nombreContacto"/>
                </div>
                <div class="row">
                    <div class="col-6 mb-2">
                        <label class="form-label">Teléfono</label>
                        <input type="text" class="form-control" id="telefono"/>
                    </div>
                    <div class="col-6 mb-2">
                        <label class="form-label">Correo</label>
                        <input type="email" class="form-control" id="correo"/>
                    </div>
                </div>
                <div class="mb-2">
                    <label class="form-label">Dirección</label>
                    <input type="text" class="form-control" id="direccion"/>
                </div>
                <div id="errorProveedor" class="text-danger small"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/proveedores.js}"></script>
</body>
</html>
