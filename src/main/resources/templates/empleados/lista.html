<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Empleados')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Empleados</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalEmpleado" onclick="abrirNuevo()">
            + Nuevo empleado
        </button>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <input type="search" id="filtroNombre" class="form-control" placeholder="Buscar por nombre..."/>
        </div>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead>
                <tr><th>Documento</th><th>Nombre completo</th><th>Cargo</th><th>Correo</th><th class="text-end">Acciones</th></tr>
                </thead>
                <tbody id="tablaEmpleados"><tr><td colspan="5" class="text-center text-muted py-4">Cargando…</td></tr></tbody>
            </table>
        </div>
    </div>
    <p class="text-muted small mt-2">
        Para dar acceso al sistema a un empleado (usuario y contraseña), usa la sección
        <a th:href="@{/usuarios}">Usuarios</a> con el id del empleado.
    </p>
</div>

<div class="modal fade" id="modalEmpleado" tabindex="-1">
    <div class="modal-dialog">
        <form class="modal-content" id="formEmpleado" onsubmit="return guardarEmpleado(event)">
            <div class="modal-header">
                <h5 class="modal-title" id="tituloModal">Nuevo empleado</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="empleadoId"/>
                <div class="row">
                    <div class="col-6 mb-2">
                        <label class="form-label">Documento *</label>
                        <input type="text" class="form-control" id="documento" required/>
                    </div>
                    <div class="col-6 mb-2">
                        <label class="form-label">Cargo *</label>
                        <input type="text" class="form-control" id="cargo" required/>
                    </div>
                </div>
                <div class="mb-2">
                    <label class="form-label">Nombre completo *</label>
                    <input type="text" class="form-control" id="nombreCompleto" required/>
                </div>
                <div class="row">
                    <div class="col-6 mb-2">
                        <label class="form-label">Teléfono</label>
                        <input type="text" class="form-control" id="telefono"/>
                    </div>
                    <div class="col-6 mb-2">
                        <label class="form-label">Correo</label>
                        <input type="email" class="form-control" id="correo"/>
                    </div>
                </div>
                <div class="mb-2">
                    <label class="form-label">Dirección</label>
                    <input type="text" class="form-control" id="direccion"/>
                </div>
                <div class="row">
                    <div class="col-6 mb-2">
                        <label class="form-label">Salario</label>
                        <input type="number" class="form-control" id="salario" min="0" step="0.01"/>
                    </div>
                    <div class="col-6 mb-2">
                        <label class="form-label">Fecha de ingreso</label>
                        <input type="date" class="form-control" id="fechaIngreso"/>
                    </div>
                </div>
                <div id="errorEmpleado" class="text-danger small"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/empleados.js}"></script>
</body>
</html>
