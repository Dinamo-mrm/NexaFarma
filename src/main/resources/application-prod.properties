# === Perfil PROD: Supabase (PostgreSQL) via variables de entorno ===
# DB_URL debe ser la cadena del "Session pooler" de Supabase (host
# aws-0-<region>.pooler.supabase.com, puerto 5432) y no la conexion directa
# (db.<ref>.supabase.co), que solo resuelve por IPv6 y falla con
# UnknownHostException en redes/hosts IPv4-only. Tampoco usar el
# "Transaction pooler" (puerto 6543): Hibernate/Flyway dependen de prepared
# statements que ese modo no soporta de forma confiable.
# Ejemplo de DB_URL:
#   jdbc:postgresql://aws-0-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require
# DB_USER en modo pooler es "postgres.<project-ref>", no solo "postgres".
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

logging.level.com.nexafarma=INFO
logging.level.org.springframework.security=WARN
