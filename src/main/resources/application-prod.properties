# === Perfil PROD: Supabase (PostgreSQL) via variables de entorno ===
# Usar la cadena de conexion "Session pooler" o la conexion directa de
# Supabase (puerto 5432), NUNCA el "Transaction pooler" (puerto 6543):
# Hibernate/Flyway dependen de prepared statements que el pooler en modo
# transaccion no soporta de forma confiable.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

logging.level.com.nexafarma=INFO
logging.level.org.springframework.security=WARN
