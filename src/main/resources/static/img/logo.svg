<svg width="40" height="40" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Logo NexaFarma">
    <!-- Escudo de bordes suaves y redondeados, trazado con línea continua -->
    <path d="M50 6
             C 68 6, 84 14, 84 14
             L 84 46
             C 84 68, 70 84, 50 94
             C 30 84, 16 68, 16 46
             L 16 14
             C 16 14, 32 6, 50 6 Z"
          fill="none" stroke="#0047AB" stroke-width="6" stroke-linejoin="round"/>
    <!-- Silueta interior: cápsula, conectando el rigor de los datos con la ciencia médica -->
    <rect x="34" y="42" width="32" height="16" rx="8" ry="8"
          fill="none" stroke="#0047AB" stroke-width="4"/>
    <line x1="50" y1="42" x2="50" y2="58" stroke="#0047AB" stroke-width="4"/>
</svg>
