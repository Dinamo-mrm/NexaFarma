# ==========================================
# NexaFarma - Configuración General
# ==========================================

spring.application.name=nexafarma

# Perfil activo (dev | prod)
spring.profiles.active=dev

# ------------------------------------------
# Thymeleaf
# ------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ------------------------------------------
# Base de datos - Supabase (PostgreSQL)
# ------------------------------------------
spring.datasource.url=jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.nxxpgadsjoagjaekrzik
spring.datasource.password=N3x4F4rw@#*
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------
# JPA / Hibernate
# ------------------------------------------
# NOTA: 'validate' exige que las tablas ya existan (ideal con Flyway).
# Si aún no tienes migraciones y estás en desarrollo inicial,
# cámbialo temporalmente a 'update'.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ------------------------------------------
# Flyway (Migraciones controladas)
# ------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ------------------------------------------
# Archivos adjuntos (facturas, fórmulas médicas, etc.)
# ------------------------------------------
app.upload-dir=uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ------------------------------------------
# Manejo de errores
# ------------------------------------------
server.error.include-message=always
server.error.include-binding-errors=always

# ------------------------------------------
# Propiedades custom de NexaFarma
# ------------------------------------------
# Días de anticipación para considerar un lote "próximo a vencer"
nexafarma.lotes.dias-proximos-vencer=30