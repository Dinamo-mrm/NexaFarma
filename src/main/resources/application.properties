# === NexaFarma - Configuracion general ===
spring.application.name=nexafarma

# Perfil activo por defecto (se puede sobreescribir con -Dspring.profiles.active=prod)
spring.profiles.active=dev

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway (migraciones controladas de la base de datos)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Tamano maximo de subida (facturas, adjuntos de formulas medicas, etc.)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Manejo de errores
server.error.include-message=always
server.error.include-binding-errors=always
