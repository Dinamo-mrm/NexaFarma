# === Perfil TEST: H2 en memoria, autonomo (no depende de Supabase ni de Flyway) ===
# Las pruebas de este modulo no deben depender de la conexion a Supabase ni
# de que las migraciones de Flyway esten al dia. Con ddl-auto=create-drop,
# Hibernate genera el esquema a partir de las entidades JPA para cada
# ejecucion de prueba.
spring.datasource.url=jdbc:h2:mem:nexafarma_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.flyway.enabled=false

logging.level.com.nexafarma=INFO
